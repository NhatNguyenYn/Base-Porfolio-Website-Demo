<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio Studio — Demo</title>
    <!--
      Root redirect for the GitHub Pages demo. In the full-stack build the
      middleware redirects "/" to "/vi" before this file is ever served; in a
      static export there is no middleware, so this static page does the job.
      Relative target so it works under the Pages subpath.
    -->
    <meta http-equiv="refresh" content="0; url=./vi/" />
    <script>
      window.location.replace("./vi/");
    </script>
  </head>
  <body>
    <p>
      Đang chuyển tới bản demo… <a href="./vi/">Tiếng Việt</a> ·
      <a href="./en/">English</a>
    </p>
  </body>
</html>
